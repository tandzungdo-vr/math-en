<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Tiếng Anh Toán học</title>

  <!-- Page source. build.sh fills in the API key and encrypts this page
       with StatiCrypt into docs/index.html — edit here, never there.
       The scripts and stylesheet it loads live in docs/. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' fill='%23fff' text-anchor='middle'%3E%CF%80%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <script>
    try {
      var t = localStorage.getItem('theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
    window.MATH_EN = { apiKey: '%%GOOGLE_API_KEY%%', syncUrl: '%%SYNC_URL%%', syncKey: '%%SYNC_KEY%%' };
  </script>
</head>

<body>
  <div class="page">

    <!-- ============================== header ============================== -->
    <header>
      <div class="switches">
        <span class="usage" id="usage" tabindex="0" hidden></span>
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" data-act="lang" data-arg="vi">VI</button><span aria-hidden="true">/</span><button type="button" data-act="lang" data-arg="en">EN</button>
        </div>
        <button class="theme-switch" id="theme-switch" type="button" aria-label="Switch to dark mode">
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
      <h1><span data-i18n="title">Tiếng Anh Toán học</span> <span class="alias" data-i18n="alias">Math in English</span></h1>
      <p class="intro" data-i18n="intro"></p>
      <nav class="links tabs" aria-label="Sections">
        <a href="#translate" data-act="tab" data-arg="translate" data-i18n="tabTranslate">Dịch câu</a>
        <a href="#vocab" data-act="tab" data-arg="vocab" data-i18n="tabVocab">Từ vựng</a>
        <a href="#saved" data-act="tab" data-arg="saved" data-i18n="tabSaved">Đã lưu</a>
      </nav>
    </header>

    <!-- ============================ translate ============================= -->
    <section id="tab-translate">
      <div class="grid two-col">
        <div class="item">
          <div class="item-meta" data-i18n="labelVi">Tiếng Việt</div>
          <div class="item-content">
            <textarea id="input" rows="3" lang="vi" spellcheck="false" data-i18n-ph="inputPh"></textarea>
            <div class="controls">
              <button type="button" id="btn-translate" class="btn" data-i18n="translate">Dịch</button>
              <label class="check"><input type="checkbox" id="opt-glossary" checked> <span data-i18n="optGlossary"></span></label>
              <span class="hint">Ctrl/⌘ + Enter</span>
            </div>
            <div class="examples"><span data-i18n="tryExample"></span><span id="examples" class="actions"></span></div>
            <p id="status" class="status" role="alert" hidden></p>
          </div>
        </div>
      </div>

      <div id="result" class="grid two-col result" hidden>
        <div class="item">
          <div class="item-meta" data-i18n="labelEn">Tiếng Anh</div>
          <div class="item-content">
            <p id="output" class="output" lang="en"></p>
            <div id="result-actions" class="actions"></div>
            <p id="glossary-note" class="note" data-i18n="glossaryNote" hidden></p>
          </div>
        </div>
        <div class="item" id="formulas-item">
          <div class="item-meta" data-i18n="labelFormulas"></div>
          <div class="item-content"><ul id="formulas" class="plain-list"></ul></div>
        </div>
        <div class="item" id="terms-item">
          <div class="item-meta" data-i18n="labelTerms"></div>
          <div class="item-content"><ul id="terms" class="plain-list"></ul></div>
        </div>
      </div>

      <h2 class="section-title" data-i18n="history"></h2>
      <div id="history" class="grid two-col compact"></div>
      <button type="button" id="clear-history" class="link more" data-act="clear-history" data-i18n="clearHistory"></button>
    </section>

    <!-- ============================ vocabulary ============================ -->
    <section id="tab-vocab" hidden>
      <div class="vocab-tools">
        <input type="search" id="vocab-search" data-i18n-ph="search" autocomplete="off">
        <span id="vocab-count" class="count"></span>
      </div>
      <nav id="topics" class="actions topics" aria-label="Topics"></nav>
      <div id="vocab-list" class="grid two-col"></div>
    </section>

    <!-- ============================== saved =============================== -->
    <section id="tab-saved" hidden>
      <h2 class="section-title first" data-i18n="flashcards"></h2>
      <div class="deck-pick">
        <label><span data-i18n="deckLabel"></span> <select id="deck-select"></select></label>
      </div>
      <p id="deck-note" class="section-note"></p>
      <div class="flashcard">
        <div class="card-count" id="card-count"></div>
        <div class="card-front" id="card-front"></div>
        <div class="card-back" id="card-back" lang="en" hidden></div>
        <div class="actions">
          <button type="button" class="link" data-act="card-prev" data-i18n="prev"></button>
          <button type="button" class="link" id="card-flip" data-act="card-flip" data-i18n="flip"></button>
          <button type="button" class="link" data-act="card-next" data-i18n="next"></button>
          <button type="button" class="link" data-act="card-shuffle" data-i18n="shuffle"></button>
        </div>
      </div>

      <h2 class="section-title" data-i18n="savedSentences"></h2>
      <div id="saved-sentences" class="grid two-col compact"></div>

      <h2 class="section-title" data-i18n="savedWords"></h2>
      <div id="saved-words" class="grid two-col"></div>

      <h2 class="section-title" id="backup-title" data-i18n="backup"></h2>
      <p class="section-note" id="backup-note" data-i18n="backupNote"></p>
      <p id="sync-row" class="sync-row" hidden><span id="sync-status" role="status"></span> <button type="button" class="link" data-act="sync" data-i18n="syncNow"></button></p>
      <div class="actions backup-actions">
        <button type="button" class="link" data-act="export" data-i18n="export"></button>
        <button type="button" class="link" data-act="import" data-i18n="import"></button>
        <input type="file" id="import-file" accept=".json,application/json" hidden>
      </div>
      <p id="backup-status" class="note" role="status" hidden></p>
    </section>

    <footer>
      <label id="voice-row" class="voice" hidden><span data-i18n="voice"></span> <select id="voice"></select></label>
      <a href="https://dotandung.github.io/" data-i18n="home">Trang chủ</a>
    </footer>
  </div>

  <script src="math.js"></script>
  <script src="vocab.js"></script>
  <script src="app.js"></script>
</body>

</html>
